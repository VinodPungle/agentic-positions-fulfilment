# CI/CD pipeline.
#
# CI (backend/frontend jobs): runs on every pull request and every push to main.
# Each does its own lint pass, then its own test suite. Either failing fails the
# whole workflow, which is what blocks a PR from being mergeable once branch
# protection requires this workflow as a required check.
#
# CD (deploy job): runs only after backend+frontend succeed, and only on a push
# to main (never on PRs — nothing deploys until code actually lands on main).
# See the big comment on the `deploy` job below for what it does and why.
#
# What this workflow does NOT do: enforce PR approvals, require CODEOWNERS
# review, or restrict who can merge. GitHub Actions has no ability to configure
# that — it's a repo setting (Settings > Branches > Branch protection rules),
# not a workflow file.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Lint the release-computation script
        working-directory: .
        # Reuses backend/.flake8's settings (max-line-length etc.) rather than a
        # second config file, since scripts/ has no other lint config of its own.
        run: flake8 --config=backend/.flake8 scripts/

      - name: Unit tests (pytest)
        # Explicitly scoped to tests/unit — bare `pytest` would also try to collect
        # tests/backend_test.py, a *live-server* integration suite that needs a
        # running deployment, a real MongoDB, and real OpenAI calls. That suite is
        # not CI-safe (slow, costs money, needs secrets) and is intentionally left
        # out of this pipeline; run it manually against a real environment instead.
        run: pytest tests/unit

      - name: Unit tests for the release-computation script
        # scripts/ lives outside backend/, hence the explicit working-directory
        # override just for this one step (the job default is backend/).
        working-directory: .
        run: pytest scripts/tests

  frontend:
    name: Frontend (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint + build
        # CRA turns ESLint warnings into build failures when CI=true — this is the
        # project's linting gate for the frontend (no separate `yarn lint` script
        # exists). Also doubles as a build-sanity check: if this breaks, the Docker
        # image's frontend-build stage would too.
        env:
          CI: true
        run: yarn build

      - name: Unit tests (Jest)
        env:
          CI: true
        run: yarn test --watchAll=false

  deploy:
    name: Version, release, and deploy to Azure
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only on a real push to main — never for pull requests, so nothing ever
    # deploys before code actually lands.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize deploys: if two pushes to main land close together, the second
    # run waits for the first to finish rather than racing it (which could let
    # an older commit's deploy land after a newer one).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write   # to push the release-artifact commit, the version tag, and create the GitHub Release
      id-token: write   # to authenticate to Azure via OIDC (azure/login) — no stored secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history + tags — compute_release.py needs to diff against the last tag
          fetch-tags: true

      - name: Compute next version, release notes, and rollback plan
        id: release
        # Pure-stdlib script (see scripts/compute_release.py) — no pip install needed.
        # Parses Conventional Commits since the last vX.Y.Z tag to decide the SemVer
        # bump, writes releases/vX.Y.Z-NOTES.md and releases/vX.Y.Z-ROLLBACK.md, and
        # exposes version/previous_version/has_changes for the steps below.
        run: |
          python3 scripts/compute_release.py \
            --output-dir releases \
            --acr-login-server "${{ vars.ACR_NAME }}.azurecr.io" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --container-app "${{ vars.CONTAINER_APP_NAME }}"

      - name: Azure login (OIDC)
        if: steps.release.outputs.has_changes == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        if: steps.release.outputs.has_changes == 'true'
        # Tags with both the immutable version (what actually gets deployed —
        # see the next step) and `latest` (convenience only, never used to deploy).
        run: |
          az acr build --registry "${{ vars.ACR_NAME }}" \
            --image "agentic-fulfilment-app:${{ steps.release.outputs.version }}" \
            --image "agentic-fulfilment-app:latest" \
            --file Dockerfile .

      - name: Deploy to Azure Container Apps
        if: steps.release.outputs.has_changes == 'true'
        run: |
          az containerapp update \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.CONTAINER_APP_NAME }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/agentic-fulfilment-app:${{ steps.release.outputs.version }}"

      - name: Verify deployment health
        if: steps.release.outputs.has_changes == 'true'
        # Deliberately blocks everything after it: if the new revision never comes
        # up healthy, we must not tag/release/record this as a successful version —
        # that would make the rollback doc's "last known-good" claim a lie.
        run: |
          FQDN=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.CONTAINER_APP_NAME }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in 1 2 3 4 5 6; do
            if curl -sf "https://$FQDN/api/" > /dev/null; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Health check attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Deployment health check failed after 6 attempts — not tagging or releasing this version." >&2
          exit 1

      - name: Commit release notes and rollback plan
        if: steps.release.outputs.has_changes == 'true'
        # [skip ci] is load-bearing: without it, this push back to main would
        # re-trigger this exact workflow, which would find no new conventional
        # commits (has_changes=false) and no-op — harmless, but wasteful and
        # confusing in the Actions history. GitHub recognizes [skip ci] natively.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.release.outputs.notes_path }}" "${{ steps.release.outputs.rollback_path }}"
          git commit -m "chore(release): ${{ steps.release.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Tag the release
        if: steps.release.outputs.has_changes == 'true'
        run: |
          git tag "${{ steps.release.outputs.version }}"
          git push origin "${{ steps.release.outputs.version }}"

      - name: Create GitHub Release
        if: steps.release.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.rollback_path }}" \
            --title "${{ steps.release.outputs.version }}" \
            --notes-file "${{ steps.release.outputs.notes_path }}"
